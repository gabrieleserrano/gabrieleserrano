<svg xmlns="http://www.w3.org/2000/svg" width="494" height="84" viewBox="0 0 494 84"><style>
:root{--card:#f4efe8;--line:#e4dbd0;--ink:#1b1714;--mut:#6f6359;--acc:#d9480f;--acc2:#f59f00;
--h0:#e6ddd2;--h1:#ffd3b4;--h2:#ffa56b;--h3:#ee6420;--h4:#b23d08}
@media (prefers-color-scheme: dark){:root{--card:#171310;--line:#2c241f;--ink:#f3ece4;--mut:#9c8f84;--acc:#ff7a2f;--acc2:#ffc04d;
--h0:#28201b;--h1:#552410;--h2:#933812;--h3:#e5560d;--h4:#ffa25c}}
@font-face{font-family:'JBMono';font-style:normal;font-weight:400;src:url(data:font/woff;base64,) format('woff')}
.card{fill:var(--card)}
.ink{fill:var(--ink)} .mut{fill:var(--mut)} .acc{fill:var(--acc)}
.in{opacity:0;animation:in .9s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.fade{opacity:0;animation:fade .5s ease-out forwards}
@keyframes fade{to{opacity:1}}
@media (prefers-reduced-motion: reduce){.in,.fade{animation:none;opacity:1}}
.arr{animation:nudge 2.4s ease-in-out infinite}@keyframes nudge{50%{transform:translate(3px,-3px)}}@media (prefers-reduced-motion: reduce){.arr{animation:none}}</style><rect class="card" width="494" height="84" rx="18"/><g class="in" style="animation-delay:0.35s" font-family="'JBMono',ui-monospace,Menlo,monospace">
<text class="mut" x="32" y="36" font-size="12" letter-spacing="1.6">LINKEDIN</text>
<text class="ink" x="32" y="61" font-size="16">in/gabriele-serrano</text>
<text class="acc arr" x="462" y="50" font-size="20" text-anchor="end">↗</text></g></svg>